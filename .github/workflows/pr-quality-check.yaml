name: PR Quality Checks
permissions:
  pull-requests: write
  contents: write
jobs:
  detect:
    name: Detect PR type
    runs-on: ubuntu-latest
    outputs:
      is_package_pr: ${{ steps.check.outputs.is_package_pr }}
    steps:
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: detect job start - PR context'
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          jq -r '"  pr=\(.pull_request.number) base=\(.pull_request.base.ref // "n/a") base_repo=\(.pull_request.base.repo.full_name // "n/a") head_sha=\(.pull_request.head.sha // "n/a") head_ref=\(.pull_request.head.ref // "n/a") head_repo=\(.pull_request.head.repo.full_name // "n/a")"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo 'GERALT_DBG: could not parse event payload'
        else
          echo 'GERALT_DBG: GITHUB_EVENT_PATH not set or missing'
        fi
      continue-on-error: true
    - name: Check if README.md is modified
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        files=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' 2>/dev/null || echo "")
        if echo "$files" | grep -q '^README.md$'; then
          echo "is_package_pr=true" >> "$GITHUB_OUTPUT"
          echo "README.md is modified — this is a package PR"
        else
          echo "is_package_pr=false" >> "$GITHUB_OUTPUT"
          echo "README.md not modified — skipping quality checks"
        fi
  quality:
    name: Repository quality checks
    needs: detect
    if: needs.detect.outputs.is_package_pr == 'true'
    runs-on: ubuntu-latest
    environment: action
    container: golang:latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: quality job start - PR context (pre-checkout)'
        printf '  repo=%s event=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NAME"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          jq -r '"  pr=\(.pull_request.number) base=\(.pull_request.base.ref // "n/a") base_repo=\(.pull_request.base.repo.full_name // "n/a") head_sha=\(.pull_request.head.sha // "n/a") head_ref=\(.pull_request.head.ref // "n/a") head_repo=\(.pull_request.head.repo.full_name // "n/a")"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo 'GERALT_DBG: could not parse event payload'
        else
          echo 'GERALT_DBG: GITHUB_EVENT_PATH not set or missing'
        fi
      continue-on-error: true
    - uses: actions/checkout@v6.0.3
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Fetch base branch
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch origin ${{ github.base_ref }}
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: immediately before sink go run ./.github/scripts/check-quality/'
        printf '  checked_out_HEAD=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo 'no HEAD')"
        for d in .github/scripts/check-quality .github/scripts/check-pr-diff; do
          if [ -d "$d" ]; then
            echo "  $d present:"
            ls -la "$d" 2>/dev/null | sed 's/^/    /'
          else
            echo "  $d MISSING"
          fi
        done
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          echo "  GITHUB_TOKEN: set (len=${#GITHUB_TOKEN})"
        else
          echo "  GITHUB_TOKEN: unset"
        fi
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          echo '  PR body snippet:'
          jq -r '.pull_request.body // "(empty)"' "$GITHUB_EVENT_PATH" 2>/dev/null | head -c 500 | sed 's/^/    /' || echo '    (unreadable)'
        fi
      continue-on-error: true
    - name: Run quality checks
      id: quality
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: go run ./.github/scripts/check-quality/
    - name: Run diff checks
      id: diff
      continue-on-error: true
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: go run ./.github/scripts/check-pr-diff/
  auto-merge:
    name: Enable auto-merge
    needs: quality
    if: always() && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: auto-merge job start'
        printf '  quality_result=%s\n' "${{ needs.quality.result }}"
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          echo '  GITHUB_TOKEN: set'
        else
          echo '  GITHUB_TOKEN: unset'
        fi
        printf '  pr=%s repo=%s\n' "${{ github.event.pull_request.number }}" "$GITHUB_REPOSITORY"
      continue-on-error: true
    - name: Enable auto-merge via squash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr merge ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --auto \
          --squash
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
    - reopened
