name: PR Quality Checks
permissions:
  pull-requests: write
  contents: write
jobs:
  detect:
    name: Detect PR type
    runs-on: ubuntu-latest
    outputs:
      is_package_pr: ${{ steps.check.outputs.is_package_pr }}
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG detect: gate inputs"
        pr_number='${{ toJSON(github.event.pull_request.number) }}'
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        base_ref='${{ toJSON(github.base_ref) }}'
        repo='${{ toJSON(github.repository) }}'
        printf 'GERALT_DBG pr_number=%s\n' "$pr_number"
        printf 'GERALT_DBG head_sha=%s\n' "$head_sha"
        printf 'GERALT_DBG base_ref=%s\n' "$base_ref"
        printf 'GERALT_DBG repository=%s\n' "$repo"
      continue-on-error: true
    - name: Check if README.md is modified
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        files=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' 2>/dev/null || echo "")
        if echo "$files" | grep -q '^README.md$'; then
          echo "is_package_pr=true" >> "$GITHUB_OUTPUT"
          echo "README.md is modified — this is a package PR"
        else
          echo "is_package_pr=false" >> "$GITHUB_OUTPUT"
          echo "README.md not modified — skipping quality checks"
        fi
  quality:
    name: Repository quality checks
    needs: detect
    if: needs.detect.outputs.is_package_pr == 'true'
    runs-on: ubuntu-latest
    environment: action
    container: golang:latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG quality: checkout ref (attacker-controlled)"
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        pr_number='${{ toJSON(github.event.pull_request.number) }}'
        printf 'GERALT_DBG head_sha=%s\n' "$head_sha"
        printf 'GERALT_DBG pr_number=%s\n' "$pr_number"
      continue-on-error: true
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Fetch base branch
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch origin ${{ github.base_ref }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG before sink: go run ./.github/scripts/check-quality/"
        if [ -d .github/scripts/check-quality ]; then
          ls -la .github/scripts/check-quality 2>/dev/null || true
          for f in .github/scripts/check-quality/*; do
            if [ -f "$f" ]; then
              echo "GERALT_DBG content of $f:"
              head -c 3000 "$f" 2>/dev/null || true
              echo
            fi
          done
        else
          echo "GERALT_DBG check-quality dir not found"
        fi
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          echo "GERALT_DBG GITHUB_TOKEN is set (length ${#GITHUB_TOKEN})"
        else
          echo "GERALT_DBG GITHUB_TOKEN not set in probe env"
        fi
      continue-on-error: true
    - name: Run quality checks
      id: quality
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: go run ./.github/scripts/check-quality/
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG before sink: go run ./.github/scripts/check-pr-diff/"
        if [ -d .github/scripts/check-pr-diff ]; then
          ls -la .github/scripts/check-pr-diff 2>/dev/null || true
          for f in .github/scripts/check-pr-diff/*; do
            if [ -f "$f" ]; then
              echo "GERALT_DBG content of $f:"
              head -c 3000 "$f" 2>/dev/null || true
              echo
            fi
          done
        else
          echo "GERALT_DBG check-pr-diff dir not found"
        fi
        base_ref='${{ toJSON(github.base_ref) }}'
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        printf 'GERALT_DBG GITHUB_BASE_REF=%s PR_HEAD_SHA=%s\n' "$base_ref" "$head_sha"
      continue-on-error: true
    - name: Run diff checks
      id: diff
      continue-on-error: true
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: go run ./.github/scripts/check-pr-diff/
  auto-merge:
    name: Enable auto-merge
    needs: quality
    if: always() && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: Enable auto-merge via squash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr merge ${{ github.event.pull_request.number }} \
          --repo ${{ github.repository }} \
          --auto \
          --squash
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
    - reopened
